services:

  # ── Kafka (KRaft, single node, no ZooKeeper) ──────────────────────────────
  kafka:
    image: apache/kafka:4.1.2
    container_name: rr-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # 22-char base64 UUID — do not change after first start
      CLUSTER_ID: "RrK1cXLXRsSV6I1unJV1eg"
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "9092:9092"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ── Kafka UI ────────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: rr-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8080:8080"
    restart: unless-stopped

  # ── Ingestion service (producers) ──────────────────────────────────────────
  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    image: riskrank:dev
    container_name: rr-ingestion
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      RISKRANK_CONFIG: /app/config/default.yaml
    volumes:
      - ./data:/app/data
    command: ["sleep", "infinity"]
    restart: unless-stopped

  # ── Consumer / file-sink service ────────────────────────────────────────────
  consumer:
    image: riskrank:dev
    container_name: rr-consumer
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      RISKRANK_CONFIG: /app/config/default.yaml
    volumes:
      - ./data:/app/data
    command: ["sleep", "infinity"]
    restart: unless-stopped

  # ── JupyterLab ──────────────────────────────────────────────────────────────
  jupyter:
    image: riskrank:dev
    container_name: rr-jupyter
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      RISKRANK_CONFIG: /app/config/default.yaml
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-riskrank}
    volumes:
      - ./data:/app/data
      - ./notebooks:/app/notebooks
    ports:
      - "8888:8888"
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --allow-root
      - --notebook-dir=/app/notebooks
    restart: unless-stopped

volumes:
  kafka-data:
    driver: local
